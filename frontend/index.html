<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Domotique</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Maison - Dashboard Domotique</h1>
      <section id="rooms" class="grid"></section>
    </main>

    <dialog id="temperatureModal">
      <article>
        <header>
          <h2 id="modalTitle">Historique température</h2>
          <button id="closeModal" class="ghost">Fermer</button>
        </header>
        <canvas id="temperatureChart"></canvas>
      </article>
    </dialog>

    <audio id="alarmSound" preload="auto">
      <source src="data:audio/wav;base64,UklGRhQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=" type="audio/wav" />
    </audio>
    <script src="/app.js"></script>
  </body>
  </html>
